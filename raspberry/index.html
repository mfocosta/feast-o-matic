<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controlo Alimentador</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background-color: #f4f4f9; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto; }
        h1 { color: #333; }
        .status-box { margin: 20px 0; padding: 15px; background: #e0e7ff; border-radius: 5px; }
        button { background-color: #4CAF50; color: white; padding: 15px 32px; font-size: 16px; border: none; border-radius: 5px; cursor: pointer; transition: 0.3s; margin: 5px;}
        button:hover { background-color: #45a049; }
        button:active { transform: scale(0.98); }
        .btn-ota { background-color: #2196F3; }
        .btn-ota:hover { background-color: #1976D2; }
        input[type=number] { padding: 10px; font-size: 16px; border-radius: 5px; border: 1px solid #ccc; width: 100px; text-align: center; margin: 10px 0; }
    </style>
</head>
<body>

    <div class="card">
        <h1>🐶 Alimentador Smart</h1>
        
        <div class="status-box">
            <p>Estado atual:</p>
            <h2 id="display-estado">A aguardar dados...</h2>
        </div>

        <label for="grams">Gramas:</label><br>
        <input type="number" id="grams" value="100" min="1" max="1000"><br>
        <button onclick="alimentar()">🍖 Libertar Comida</button>
        <button class="btn-ota" onclick="atualizarOTA()">🔄 Atualizar OTA</button>
    </div>

    <script>
        // Conectar ao servidor Flask via SocketIO
        const socket = io();

        // 1. Receber dados do ESP32 (via Python)
        socket.on('atualizacao_sensor', function(msg) {
            console.log("Dados recebidos: " + msg.dados);
            // Atualiza o texto na página
            document.getElementById('display-estado').innerText = msg.dados;
        });

        // 2. Enviar comando para o ESP32 (via Python)
        function alimentar() {
            const grams = document.getElementById('grams').value;
            console.log("Enviando comando... " + grams + "g");
            socket.emit('comando_alimentar', { grams: parseInt(grams) });
            document.getElementById('display-estado').innerText = "Comando enviado... " + grams + "g";
        }

        function atualizarOTA() {
            console.log("Enviando comando OTA...");
            socket.emit('comando_ota');
            document.getElementById('display-estado').innerText = "A iniciar atualização OTA...";
        }
    </script>
</body>
</html>
